# ClassicPress on PHP-FPM (Alpine) behind nginx.
# Usage (from the examples folder): docker compose -f docker-compose.fpm-alpine.yml up -d
services:
  classicpress:
    image: classicpress/classicpress:php8.4-fpm-alpine
    container_name: classicpress
    environment:
      CLASSICPRESS_DB_HOST: db:3306
      CLASSICPRESS_DB_USER: classicpress
      CLASSICPRESS_DB_PASSWORD: classicpress
      CLASSICPRESS_DB_NAME: classicpress
    volumes:
      - classicpress_data:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine
    container_name: classicpress_nginx
    ports:
      - "80:80"
    volumes:
      - classicpress_data:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - classicpress

  db:
    image: mysql:8.4
    container_name: classicpress_db
    restart: always
    environment:
      MYSQL_DATABASE: classicpress
      MYSQL_USER: classicpress
      MYSQL_PASSWORD: classicpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  classicpress_data:
  db_data:
