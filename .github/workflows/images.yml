name: Build and Deploy Docker

# When images are built and when they are published:
#   pull request         build and test, never published
#   push to develop      build and test, never published
#   push to main         build, test and publish
#   weekly schedule      rebuild main, test and publish, so upstream PHP and
#                        Debian/Alpine security fixes reach the images
#   manual run           build and test; published only when run on main
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: php${{ matrix.php }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', variant: apache,     dockerfile: apache/php8.1/Dockerfile }
          - { php: '8.2', variant: apache,     dockerfile: apache/php8.2/Dockerfile }
          - { php: '8.3', variant: apache,     dockerfile: apache/php8.3/Dockerfile }
          - { php: '8.4', variant: apache,     dockerfile: apache/php8.4/Dockerfile }
          - { php: '8.5', variant: apache,     dockerfile: apache/php8.5/Dockerfile,            extra_tags: latest }
          - { php: '8.2', variant: fpm-alpine, dockerfile: fpm-alpine/php8.2/Dockerfile }
          - { php: '8.3', variant: fpm-alpine, dockerfile: fpm-alpine/php8.3/Dockerfile }
          - { php: '8.4', variant: fpm-alpine, dockerfile: fpm-alpine/php8.4/Dockerfile }
          - { php: '8.5', variant: fpm-alpine, dockerfile: fpm-alpine/php8.5/Dockerfile, extra_tags: fpm-alpine }
    env:
      IMAGE: classicpress/classicpress
      TEST_IMAGE: classicpress-test:local
      PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Scheduled runs start from the default branch (develop); always publish from main.
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      - name: Work out image tags
        id: meta
        run: |
          set -euo pipefail
          cp_version="$(sed -n "s/^[[:space:]]*version='\([0-9.]*\)'.*/\1/p" "${{ matrix.dockerfile }}" | head -n1)"
          test -n "$cp_version"
          cp_minor="${cp_version%.*}"
          suffix="php${{ matrix.php }}-${{ matrix.variant }}"
          {
            echo "cp_version=$cp_version"
            echo "tags<<EOF"
            echo "$IMAGE:$suffix"
            echo "$IMAGE:$cp_version-$suffix"
            echo "$IMAGE:$cp_minor-$suffix"
            for tag in ${{ matrix.extra_tags }}; do echo "$IMAGE:$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.variant }}

      - name: Test image
        run: |
          set -euo pipefail
          echo "::group::PHP"
          docker run --rm --entrypoint php "$TEST_IMAGE" -v
          docker run --rm --entrypoint php "$TEST_IMAGE" -m | tee /tmp/modules
          for ext in bcmath exif gd imagick intl mysqli zip; do
            grep -qix "$ext" /tmp/modules || { echo "::error::PHP extension $ext is missing"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::ClassicPress version"
          got="$(docker run --rm --entrypoint php "$TEST_IMAGE" -r 'include "/usr/src/classicpress/wp-includes/version.php"; echo $cp_version;')"
          echo "image has ClassicPress $got, Dockerfile says ${{ steps.meta.outputs.cp_version }}"
          test "$got" = "${{ steps.meta.outputs.cp_version }}"
          echo "::endgroup::"

          echo "::group::WP-CLI"
          docker run --rm --entrypoint wp "$TEST_IMAGE" --allow-root --info
          echo "::endgroup::"

          echo "::group::Entrypoint copies ClassicPress and writes wp-config.php"
          docker run -d --name cp-smoke -e CLASSICPRESS_DB_HOST=db "$TEST_IMAGE"
          for i in $(seq 1 30); do
            docker exec cp-smoke test -s /var/www/html/wp-config.php && break
            sleep 1
          done
          docker logs cp-smoke
          docker exec cp-smoke test -s /var/www/html/wp-config.php
          docker exec cp-smoke test -f /var/www/html/wp-includes/version.php
          test "$(docker inspect -f '{{.State.Running}}' cp-smoke)" = true
          docker rm -f cp-smoke
          echo "::endgroup::"

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.variant }}
