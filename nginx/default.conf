# Example nginx config for the classicpress/classicpress:*-fpm-alpine images.
# nginx serves static files from the shared /var/www/html volume and passes
# PHP requests to the ClassicPress container on port 9000.
server {
	listen 80;
	server_name _;

	root /var/www/html;
	index index.php;

	client_max_body_size 64m;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass classicpress:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}
}
